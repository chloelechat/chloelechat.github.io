<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Chloé Lechat</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Space+Mono&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f4f2ec;--ink:#141410;--ink-soft:#3a382f;--cobalt:#2743f0}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .code{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--cobalt);margin-bottom:18px}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.02;letter-spacing:-.02em;margin-bottom:14px}
  h1 .d{color:var(--cobalt)}
  p{color:var(--ink-soft);font-size:1.02rem;line-height:1.5;max-width:34ch;margin:0 auto 26px}
  a.btn{display:inline-flex;align-items:center;gap:10px;background:var(--cobalt);color:#fff;text-decoration:none;
    font-weight:600;font-size:1rem;padding:14px 26px;border-radius:100px}
</style>
</head>
<body>
  <main>
    <div class="code">Erreur 404</div>
    <h1>Cette page n'existe pas<span class="d">.</span></h1>
    <p>Le lien est peut-être cassé ou la page a été déplacée.</p>
    <a class="btn" href="/">Revenir à l'accueil →</a>
  </main>
</body>
</html>
